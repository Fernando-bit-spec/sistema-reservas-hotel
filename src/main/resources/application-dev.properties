spring.application.name=hotel-reservas

# Database - Development (local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Fernando123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS - Development (localhost)
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Logging
logging.level.root=INFO
logging.level.com.fernando.hotelreservas=DEBUG

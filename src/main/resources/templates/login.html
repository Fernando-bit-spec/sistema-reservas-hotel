<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Reservas de Hotel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            background-color: #fee;
            border-left: 4px solid #c33;
            color: #c33;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }

        .success-message {
            background-color: #efe;
            border-left: 4px solid #3c3;
            color: #3c3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🏨 Hotel Reservas</h1>
            <p>Sistema de Gerenciamento de Reservas</p>
        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${param.logout}" class="success-message">
            ✅ Você foi desconectado com sucesso.
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${param.error}" class="error-message">
            ❌ Email ou senha inválidos. Tente novamente.
        </div>

        <!-- Mensagem de acesso negado -->
        <div th:if="${param.expired}" class="error-message">
            ❌ Sua sessão expirou. Faça login novamente.
        </div>

        <!-- Formulário de login -->
        <form th:action="@{/login}" method="POST">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="username" 
                    placeholder="seu@email.com"
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="senha">🔒 Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="password" 
                    placeholder="Sua senha"
                    required
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember-me">
                <label for="remember">Lembrar-me</label>
            </div>

            <button type="submit" class="login-button">
                🔓 Fazer Login
            </button>

            <!-- CSRF Token -->
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        </form>

        <div class="login-footer">
            <p>Não tem acesso? <a th:href="@{/usuarios/registro}">Crie sua conta aqui</a></p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Reservas de Hotel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registro-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .registro-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .registro-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .registro-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            background-color: #fee;
            border-left: 4px solid #c33;
            color: #c33;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }

        .success-message {
            background-color: #efe;
            border-left: 4px solid #3c3;
            color: #3c3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-info {
            background-color: #f0f4ff;
            border-left: 4px solid #667eea;
            color: #333;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }

        .cadastro-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cadastro-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .cadastro-button:active {
            transform: translateY(0);
        }

        .registro-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .registro-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .registro-footer a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 12px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .requirement-icon {
            margin-right: 8px;
            width: 16px;
            text-align: center;
        }

        .requirement.met .requirement-icon {
            color: #3c3;
        }

        .requirement:not(.met) .requirement-icon {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="registro-container">
        <div class="registro-header">
            <h1>🏨 Hotel Reservas</h1>
            <p>Crie sua conta para começar</p>
        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${sucesso}" class="success-message" th:text="${sucesso}">
            ✅ Mensagem de sucesso
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}" class="error-message" th:text="${erro}">
            ❌ Mensagem de erro
        </div>

        <!-- Informação sobre o cadastro -->
        <div class="form-info">
            📝 Cadastre-se como cliente. Admins são criados apenas pelo sistema.
        </div>

        <!-- Formulário de cadastro -->
        <form th:action="@{/usuarios/registro}" method="POST" th:object="${usuario}">
            <div class="form-group">
                <label for="nome">👤 Nome Completo</label>
                <input 
                    type="text" 
                    id="nome" 
                    th:field="*{nome}"
                    placeholder="Seu nome completo"
                    required 
                    autofocus
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="email">📧 Email</label>
                <input 
                    type="email" 
                    id="email" 
                    th:field="*{email}"
                    placeholder="seu@email.com"
                    required
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="senha">🔒 Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    th:field="*{senha}"
                    placeholder="Crie uma senha forte"
                    required
                    minlength="6"
                    maxlength="100"
                >
                <div class="password-requirements">
                    <div class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>Mínimo 6 caracteres</span>
                    </div>
                    <div class="requirement">
                        <span class="requirement-icon">💡</span>
                        <span>Use letras, números e símbolos para melhor segurança</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="cadastro-button">
                ✨ Criar Conta
            </button>

            <!-- CSRF Token (automático do Thymeleaf) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>

        <div class="registro-footer">
            <p>Já tem conta? <a th:href="@{/login}">Faça login aqui</a></p>
        </div>
    </div>

    <script>
        // Validação de senha em tempo real
        const senhaInput = document.getElementById('senha');
        
        senhaInput.addEventListener('input', function() {
            const value = this.value;
            const minLength = value.length >= 6;
            
            // Você pode adicionar validações mais complexas aqui se desejar
            console.log('Senha validada:', { minLength });
        });
    </script>
</body>
</html>
